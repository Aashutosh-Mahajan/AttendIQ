name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type-check & Lint
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── 3. Install dependencies ───────────────────────────────
      - name: Install dependencies
        run: npm ci

      # postinstall runs `prisma generate` automatically

      # ── 4. Type-check ─────────────────────────────────────────
      # tsc --noEmit does not execute any code, no env vars needed
      - name: TypeScript type-check
        run: npx tsc --noEmit

      # ── 5. Lint ───────────────────────────────────────────────
      # next lint only parses code, no env vars needed
      - name: Lint
        run: npm run lint
